name: Release validation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate (for example, 0.4.0 or 0.4.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          echo "Validating v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate package metadata
        run: |
          test -s LICENSE
          test -s CHANGELOG.md
          test -s README.md
          grep -Fq '## [${{ steps.version.outputs.version }}]' CHANGELOG.md
          test "$(go list -m)" = "github.com/CWBudde/dragonfly"
          go mod verify
          go mod tidy -diff
          go vet ./...

      - name: Run tests
        run: |
          go test -timeout 20m -coverprofile=coverage.out -covermode=atomic ./...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total + 0 < 80) exit 1 }'

      - name: Compile example modules
        run: |
          for module in examples examples/basic examples/comparison examples/constrained examples/feature_selection examples/multiobjective examples/parallel; do
            (cd "$module" && go build ./...)
          done
          (cd examples/wasm-demo && GOOS=js GOARCH=wasm go build -o /dev/null . && go build -o /dev/null ./...)

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --config ./.golangci.toml --timeout 5m
